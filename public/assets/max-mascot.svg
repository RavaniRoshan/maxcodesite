<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 14 15" width="420" height="450" role="img" aria-labelledby="t">
  <title id="t">Max, the maxcode mascot</title>
  <style>
    .max-eye { transform-box: fill-box; transform-origin: center; animation: max-blink 4s infinite; }
    @keyframes max-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .max-tick { animation: max-bob 1.6s ease-in-out infinite; }
    @keyframes max-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.4px); } }
    @media (prefers-reduced-motion: reduce) { .max-eye, .max-tick { animation: none; } }
  </style>
  <g shape-rendering="crispEdges">
    <!-- body: a block cursor with feet in maxcode Terracotta / Red-Orange scheme -->
    <rect x="1" y="3" width="10" height="9" fill="#E26A2C"/>
    <rect x="1" y="3" width="10" height="1" fill="#FDBA74"/>
    <rect x="10" y="4" width="1" height="8" fill="#B84318"/>
    <rect x="1" y="11" width="10" height="1" fill="#B84318"/>
    <rect x="2" y="12" width="2" height="1" fill="#9A3412"/>
    <rect x="8" y="12" width="2" height="1" fill="#9A3412"/>
    <!-- face in warm obsidian ink -->
    <rect class="max-eye" x="3" y="5" width="1" height="2" fill="#181310"/>
    <rect class="max-eye" x="8" y="5" width="1" height="2" fill="#181310"/>
    <rect x="4" y="8" width="1" height="1" fill="#181310"/>
    <rect x="7" y="8" width="1" height="1" fill="#181310"/>
    <rect x="5" y="9" width="2" height="1" fill="#181310"/>
    <!-- the gate tick: Max wears it only when checks pass -->
    <g class="max-tick" fill="#F59E0B">
      <rect x="7" y="0" width="1" height="1" fill="#FBBF24"/>
      <rect x="4" y="1" width="1" height="1"/>
      <rect x="6" y="1" width="1" height="1"/>
      <rect x="5" y="2" width="1" height="1"/>
    </g>
  </g>
</svg>
